<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORDLE.SYS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #05050f;
            --bg2:      #09091a;
            --bg3:      #0c0c20;
            --cyan:     #00fff7;
            --cyan-dim: #00a89e;
            --pink:     #ff2d78;
            --yellow:   #ffd60a;
            --green:    #39ff14;
            --tile-bg:  #0d0d22;
            --tile-bdr: #1c1c3e;
            --correct:  #073d35;
            --present:  #4a3800;
            --absent:   #111126;
            --text:     #ccd6f6;
            --text-dim: #404070;
            --hdr: 76px;
        }

        body {
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 60% 60% at 10% 50%, rgba(0,255,247,.04) 0%, transparent 60%),
                radial-gradient(ellipse 60% 60% at 90% 50%, rgba(255,45,120,.04) 0%, transparent 60%),
                linear-gradient(rgba(0,255,247,.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,247,.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px;
            color: var(--text);
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Scanlines */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 4px);
            pointer-events: none; z-index: 9999;
        }
        body::after {
            content: '';
            position: fixed; top: -200px; left: 0; right: 0; height: 200px;
            background: linear-gradient(to bottom, transparent, rgba(0,255,247,.025), transparent);
            animation: scan 9s linear infinite;
            pointer-events: none; z-index: 9998;
        }
        @keyframes scan { to { top: 100vh; } }

        /* ─── LOADING ─── */
        #loading {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; z-index: 8000;
            transition: opacity .5s;
        }
        #loading.fade { opacity: 0; pointer-events: none; }
        .ld-title {
            font-family: 'Orbitron', monospace;
            font-size: 32px; font-weight: 900;
            letter-spacing: 10px;
            color: var(--cyan);
            text-shadow: 0 0 30px var(--cyan), 0 0 60px rgba(0,255,247,.3);
        }
        .ld-track {
            width: 280px; height: 3px;
            background: #1a1a35; border: 1px solid var(--text-dim); overflow: hidden;
        }
        #ld-bar { height: 100%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); width: 0; transition: width .4s ease; }
        #ld-text { font-size: 10px; letter-spacing: 3px; color: var(--text-dim); }

        /* ─── HEADER HUD ─── */
        .hud {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--hdr);
            background: linear-gradient(to bottom, rgba(5,5,15,.98), rgba(9,9,26,.96));
            border-bottom: 1px solid rgba(0,255,247,.5);
            box-shadow: 0 0 40px rgba(0,255,247,.12), 0 1px 0 rgba(0,255,247,.4);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 24px;
            z-index: 1000;
        }

        /* corner brackets */
        .hud::before, .hud::after {
            content: '';
            position: absolute;
            width: 14px; height: 14px;
            border-color: var(--cyan); border-style: solid;
        }
        .hud::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .hud::after  { top: -1px; right: -1px; border-width: 2px 2px 0 0; }

        .hud-stats {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .hud-stats.right { justify-content: flex-end; }

        .stat {
            display: flex; flex-direction: column; align-items: center; gap: 1px;
        }
        .stat-lbl {
            font-size: 8px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase;
        }
        .stat-val {
            font-family: 'Orbitron', monospace;
            font-size: 17px; font-weight: 700; line-height: 1;
        }
        .c  { color: var(--cyan);   text-shadow: 0 0 10px var(--cyan); }
        .p  { color: var(--pink);   text-shadow: 0 0 10px var(--pink); }
        .y  { color: var(--yellow); text-shadow: 0 0 10px var(--yellow); }
        .g  { color: var(--green);  text-shadow: 0 0 10px var(--green); }
        .w  { color: var(--text); }

        .hdiv {
            width: 1px; height: 36px;
            background: linear-gradient(to bottom, transparent, var(--cyan-dim), transparent);
            opacity: .35;
        }

        .hud-center { text-align: center; }
        .hud-title {
            font-family: 'Orbitron', monospace;
            font-size: 21px; font-weight: 900; letter-spacing: 7px;
            color: var(--cyan);
            text-shadow: 0 0 18px var(--cyan), 0 0 36px rgba(0,255,247,.25);
            position: relative;
        }
        .hud-title::before, .hud-title::after {
            content: attr(data-text);
            position: absolute; top: 0; left: 0; right: 0;
            opacity: 0;
        }
        .hud-title::before { color: var(--pink); animation: g1 5s infinite; }
        .hud-title::after  { color: var(--cyan); animation: g2 5s infinite; }

        @keyframes g1 {
            0%,88%,100% { opacity:0; transform:none; clip-path:none; }
            90% { opacity:.7; transform:translate(-3px); clip-path:polygon(0 15%, 100% 15%, 100% 40%, 0 40%); }
            93% { opacity:.7; transform:translate(3px);  clip-path:polygon(0 58%, 100% 58%, 100% 72%, 0 72%); }
            95% { opacity:0; }
        }
        @keyframes g2 {
            0%,89%,100% { opacity:0; transform:none; clip-path:none; }
            91% { opacity:.5; transform:translate(2px); clip-path:polygon(0 44%, 100% 44%, 100% 62%, 0 62%); }
            94% { opacity:0; }
        }

        .hud-sub { font-size: 8px; letter-spacing: 4px; color: var(--text-dim); margin-top: 3px; }

        .hud-action {
            background: transparent; border: 1px solid var(--text-dim);
            color: var(--text-dim); font-family: 'Share Tech Mono', monospace;
            font-size: 11px; letter-spacing: 2px; padding: 5px 10px; cursor: pointer;
            transition: all .2s;
        }
        .hud-action:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(0,255,247,.2); }

        /* ─── MAIN ─── */
        .main {
            padding-top: calc(var(--hdr) + 16px);
            display: flex; flex-direction: column; align-items: center;
            gap: 12px; padding-bottom: 40px;
        }

        /* Status */
        #status {
            height: 26px; display: flex; align-items: center; justify-content: center;
            font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
            color: var(--cyan); opacity: 0; transition: opacity .2s;
        }
        #status.show { opacity: 1; }
        #status.err  { color: var(--pink); }

        /* ─── GRID ─── */
        .grid {
            display: flex; flex-direction: column; gap: 5px;
        }
        .row {
            display: flex; gap: 5px;
        }
        .tile {
            width: 58px; height: 58px;
            background: var(--tile-bg); border: 1px solid var(--tile-bdr);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', monospace; font-size: 21px; font-weight: 700;
            color: var(--text); user-select: none; position: relative;
            transition: border-color .15s;
        }
        .tile.has-letter {
            border-color: #303060;
            background: #10102a;
            animation: tpop .1s ease-out;
        }
        @keyframes tpop { from { transform: scale(.85); } to { transform: scale(1); } }

        .tile.flip { animation: flip .5s ease-in-out forwards; }
        @keyframes flip {
            0%   { transform: scaleY(1); }
            49%  { transform: scaleY(0.02); }
            50%  { transform: scaleY(0.02); }
            100% { transform: scaleY(1); }
        }

        .tile.correct {
            background: var(--correct);
            border-color: var(--cyan);
            box-shadow: 0 0 14px rgba(0,255,247,.35), inset 0 0 10px rgba(0,255,247,.08);
            color: var(--cyan);
        }
        .tile.present {
            background: var(--present);
            border-color: var(--yellow);
            box-shadow: 0 0 14px rgba(255,214,10,.35), inset 0 0 10px rgba(255,214,10,.08);
            color: var(--yellow);
        }
        .tile.absent {
            background: var(--absent);
            border-color: #1e1e38;
            color: #30305a;
        }

        .row.shake { animation: shake .45s ease-in-out; }
        @keyframes shake {
            10%,90% { transform: translateX(-5px); }
            30%,70% { transform: translateX(5px); }
            50%     { transform: translateX(-3px); }
        }
        .row.bounce { animation: rbounce .5s ease-out; }
        @keyframes rbounce {
            20% { transform: translateY(-10px); }
            40% { transform: translateY(0); }
            60% { transform: translateY(-5px); }
            80% { transform: translateY(0); }
        }

        /* ─── KEYBOARD ─── */
        .kbd { display: flex; flex-direction: column; gap: 7px; align-items: center; }
        .krow { display: flex; gap: 5px; }
        .key {
            min-width: 36px; height: 50px;
            background: #0e0e26; border: 1px solid #1e1e3e;
            color: var(--text); font-family: 'Share Tech Mono', monospace;
            font-size: 13px; letter-spacing: 1px;
            cursor: pointer; transition: all .15s;
            display: flex; align-items: center; justify-content: center;
            padding: 0 8px; text-transform: uppercase;
        }
        .key:hover { background: #16163a; border-color: var(--text-dim); }
        .key:active { transform: scale(.93); }
        .key.wide { min-width: 56px; font-size: 11px; letter-spacing: 2px; }
        .key.correct { background: var(--correct); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 7px rgba(0,255,247,.25); }
        .key.present { background: var(--present); border-color: var(--yellow); color: var(--yellow); box-shadow: 0 0 7px rgba(255,214,10,.25); }
        .key.absent  { background: #09091a; border-color: #111126; color: #252545; }

        /* ─── SCORE POPUP ─── */
        .score-pop {
            position: fixed; font-family: 'Orbitron', monospace;
            font-size: 22px; font-weight: 900;
            color: var(--cyan); text-shadow: 0 0 16px var(--cyan);
            pointer-events: none; z-index: 3000;
            animation: floatup 1.4s ease-out forwards;
        }
        @keyframes floatup {
            0%   { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-70px); }
        }

        /* ─── MODAL ─── */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(5,5,15,.93);
            display: flex; align-items: center; justify-content: center;
            z-index: 5000; backdrop-filter: blur(6px);
        }
        .overlay.hidden { display: none; }

        .modal {
            background: var(--bg3);
            border: 1px solid rgba(0,255,247,.4);
            box-shadow: 0 0 50px rgba(0,255,247,.15), 0 0 100px rgba(0,255,247,.05);
            padding: 36px; max-width: 400px; width: 92%;
            position: relative;
            animation: min 0.28s ease-out;
        }
        @keyframes min { from { opacity:0; transform: scale(.94) translateY(-8px); } }

        .modal::before {
            content: '';
            position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
            background: linear-gradient(to right, transparent, var(--cyan), transparent);
        }

        .modal-title {
            font-family: 'Orbitron', monospace;
            font-size: 20px; font-weight: 900; letter-spacing: 4px;
            text-align: center; margin-bottom: 20px;
        }
        .modal-title.win  { color: var(--cyan); text-shadow: 0 0 20px var(--cyan); }
        .modal-title.lose { color: var(--pink); text-shadow: 0 0 20px var(--pink); }
        .modal-title.info { color: var(--yellow); }

        .modal-word {
            text-align: center; font-family: 'Orbitron', monospace;
            font-size: 28px; font-weight: 900; letter-spacing: 12px;
            margin: 12px 0 20px; color: var(--cyan);
        }
        .modal-word.lose { color: var(--pink); text-shadow: 0 0 20px var(--pink); }

        .breakdown {
            border: 1px solid #1e1e40; padding: 14px; margin-bottom: 16px;
            font-size: 12px; line-height: 2.2;
        }
        .brow { display: flex; justify-content: space-between; }
        .brow .lbl { color: var(--text-dim); }
        .brow .val { color: var(--text); }
        .brow.total { border-top: 1px solid #2a2a4a; margin-top: 4px; padding-top: 4px; }
        .brow.total .lbl, .brow.total .val { color: var(--cyan); font-weight: bold; }

        .inp {
            width: 100%; background: var(--bg2);
            border: 1px solid var(--text-dim); color: var(--text);
            font-family: 'Share Tech Mono', monospace; font-size: 14px;
            padding: 10px 14px; letter-spacing: 2px; text-transform: uppercase;
            outline: none; transition: border-color .2s;
        }
        .inp:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,255,247,.12); }
        .inp::placeholder { color: var(--text-dim); text-transform: none; }

        .btn-prim, .btn-sec {
            width: 100%; background: transparent;
            font-family: 'Orbitron', monospace;
            letter-spacing: 3px; padding: 12px;
            cursor: pointer; transition: all .2s; margin-top: 10px;
            font-size: 12px; text-transform: uppercase;
        }
        .btn-prim { border: 1px solid var(--cyan); color: var(--cyan); }
        .btn-prim:hover { background: rgba(0,255,247,.08); box-shadow: 0 0 18px rgba(0,255,247,.2); }
        .btn-prim.danger { border-color: var(--pink); color: var(--pink); }
        .btn-prim.danger:hover { background: rgba(255,45,120,.08); box-shadow: 0 0 18px rgba(255,45,120,.2); }
        .btn-sec { border: 1px solid var(--text-dim); color: var(--text-dim); font-family: 'Share Tech Mono', monospace; font-size: 11px; }
        .btn-sec:hover { border-color: var(--text); color: var(--text); }

        /* Leaderboard */
        .lb { margin-top: 12px; font-size: 11px; }
        .lb-head { font-size: 9px; letter-spacing: 3px; color: var(--text-dim); margin-bottom: 6px; }
        .lb-row {
            display: grid; grid-template-columns: 18px 1fr auto auto;
            gap: 8px; padding: 5px 0;
            border-bottom: 1px solid #14142a; align-items: center;
        }
        .lb-n { color: var(--text-dim); }
        .lb-name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; }
        .lb-att { color: var(--yellow); }
        .lb-sc { font-family: 'Orbitron', monospace; font-size: 12px; color: var(--cyan); }

        /* How-to tiles */
        .ht-row { display: flex; gap: 4px; margin: 8px 0 4px; }
        .ht { width: 34px; height: 34px; border: 1px solid; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', monospace; font-size: 15px; font-weight: 700; }
        .ht.empty   { background: var(--tile-bg); border-color: var(--tile-bdr); color: var(--text); }
        .ht.correct { background: var(--correct); border-color: var(--cyan); color: var(--cyan); }
        .ht.present { background: var(--present); border-color: var(--yellow); color: var(--yellow); }
        .ht.absent  { background: var(--absent); border-color: #1e1e38; color: #30305a; }
        .ht-desc { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 10px; line-height: 1.5; }

        /* Score table in help */
        .score-table { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; line-height: 2; margin-top: 12px; border-top: 1px solid #1e1e38; padding-top: 10px; }
        .score-table span { color: var(--cyan); }

        /* Clickable name */
        #hud-name-btn {
            cursor: pointer; background: none; border: none;
            font-family: 'Orbitron', monospace; font-size: 17px; font-weight: 700;
            color: var(--cyan); text-shadow: 0 0 10px var(--cyan);
            padding: 0; transition: opacity .2s;
        }
        #hud-name-btn:hover { opacity: .7; text-decoration: underline; text-underline-offset: 3px; }

        /* Placar table */
        .lb-full { width: 100%; font-size: 11px; }
        .lb-full .lb-row { grid-template-columns: 22px 1fr 60px 50px 70px; }
        .lb-date { color: var(--text-dim); font-size: 10px; }

        /* Restart hint */
        #restart-hint {
            display: none; align-items: center; justify-content: center;
            gap: 12px; font-size: 11px; letter-spacing: 2px; color: var(--text-dim);
        }
        #restart-hint.show { display: flex; }
        #restart-hint button {
            background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
            font-family: 'Orbitron', monospace; font-size: 11px; letter-spacing: 3px;
            padding: 6px 16px; cursor: pointer; transition: all .2s;
        }
        #restart-hint button:hover { background: rgba(0,255,247,.08); }

        /* responsive */
        @media (max-width: 480px) {
            .tile { width: 50px; height: 50px; font-size: 18px; }
            .key  { min-width: 30px; height: 44px; font-size: 12px; padding: 0 5px; }
            .key.wide { min-width: 48px; font-size: 10px; }
            .hud { padding: 0 12px; }
            .hud-title { font-size: 16px; letter-spacing: 4px; }
            .stat-val { font-size: 14px; }
            .modal { padding: 24px; }
        }
    </style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
    <div class="ld-title">WORDLE.SYS</div>
    <div class="ld-track"><div id="ld-bar"></div></div>
    <div id="ld-text">INICIANDO SISTEMA...</div>
</div>

<!-- HEADER -->
<header class="hud">
    <div class="hud-stats">
        <div class="stat">
            <span class="stat-lbl">Jogador</span>
            <button id="hud-name-btn" title="Clique para alterar nome">—</button>
        </div>
        <div class="hdiv"></div>
        <div class="stat">
            <span class="stat-lbl">Pontos</span>
            <span class="stat-val c" id="hud-score">0</span>
        </div>
        <div class="hdiv"></div>
        <div class="stat">
            <span class="stat-lbl">Streak</span>
            <span class="stat-val p" id="hud-streak">×0</span>
        </div>
    </div>

    <div class="hud-center">
        <div class="hud-title" data-text="WORDLE.SYS">WORDLE.SYS</div>
        <div class="hud-sub">PORTUGUESE EDITION // v2.0</div>
    </div>

    <div class="hud-stats right">
        <div class="stat">
            <span class="stat-lbl">Recorde</span>
            <span class="stat-val y" id="hud-high">0</span>
        </div>
        <div class="hdiv"></div>
        <div class="stat">
            <span class="stat-lbl">V / D</span>
            <span class="stat-val w" id="hud-ratio">0/0</span>
        </div>
        <div class="hdiv"></div>
        <div class="stat">
            <button class="hud-action" id="btn-placar">PLACAR</button>
        </div>
        <div class="hdiv"></div>
        <div class="stat">
            <button class="hud-action" id="btn-help">AJUDA</button>
        </div>
    </div>
</header>

<!-- MAIN -->
<main class="main">
    <div id="status"></div>
    <div id="restart-hint">
        <span>JOGO ENCERRADO</span>
        <button id="btn-restart">▶ NOVO JOGO</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="kbd"  id="kbd"></div>
</main>

<!-- MODAL -->
<div class="overlay hidden" id="overlay">
    <div class="modal" id="modal-box"></div>
</div>

<script>
/* ═══════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════ */
const WL = 5, MAX = 6;
const BASE = [1000, 850, 700, 500, 300, 150];

const FALLBACK = [
    'campo','banco','carro','grupo','porta','tempo','ponto','mundo',
    'parte','volta','ainda','mesmo','filho','poder','lugar','forma',
    'muito','tanto','pouco','menos','outro','nosso','prata','pedra',
    'areia','vento','chuva','livro','papel','linha','conta','tarde',
    'noite','fruta','ferro','cesta','corda','forca','torre','marca',
    'frase','clima','prova','sorte','plano','nicho','fonte','palco',
].filter(w => w.length === WL);

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let S = {
    word: '', guesses: [], cur: '', row: 0,
    over: false, won: false, busy: false,
    dict: [], keyState: {},
    name: '', score: 0, streak: 0,
    high: 0, played: 0, wins: 0,
};
let _modalOpen = false; // bloqueia teclado quando modal está aberto

/* ═══════════════════════════════════════════════
   PERSISTENCE — localStorage
═══════════════════════════════════════════════ */
function loadStore() {
    const d = JSON.parse(localStorage.getItem('wsys') || '{}');
    S.name   = d.name   || '';
    S.score  = d.score  || 0;
    S.streak = d.streak || 0;
    S.high   = d.high   || 0;
    S.played = d.played || 0;
    S.wins   = d.wins   || 0;
}
function saveStore() {
    localStorage.setItem('wsys', JSON.stringify({
        name: S.name, score: S.score, streak: S.streak,
        high: S.high, played: S.played, wins: S.wins,
    }));
}
// fallback local leaderboard (usado quando servidor não disponível)
function loadLBLocal()  { return JSON.parse(localStorage.getItem('wlb') || '[]'); }
function saveLBLocal(e) {
    const lb = loadLBLocal();
    lb.push(e);
    lb.sort((a, b) => a.att - b.att || b.ts - a.ts);
    lb.splice(20);
    localStorage.setItem('wlb', JSON.stringify(lb));
}

/* ═══════════════════════════════════════════════
   PERSISTENCE — API (scores.txt via servidor)
═══════════════════════════════════════════════ */
const USE_API = window.location.protocol !== 'file:';

async function saveScoreToFile(name, word, attempts) {
    const entry = {
        name: name.replace(/\s+/g, '_').slice(0, 20),
        word: word.toUpperCase(),
        attempts,
        ts: Math.floor(Date.now() / 1000),
    };
    // Salva localmente sempre
    saveLBLocal({ name: entry.name, word: entry.word, att: attempts, pts: 0, ts: entry.ts });

    if (!USE_API) return;
    try {
        await fetch('/api/scores', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify(entry),
        });
    } catch { /* servidor offline — sem problema, localStorage já guardou */ }
}

async function loadScoresFromFile() {
    if (!USE_API) return loadLBLocal();
    try {
        const r = await fetch('/api/scores');
        if (!r.ok) throw 0;
        return await r.json();   // [{ name, word, attempts, ts }, ...]
    } catch {
        // Converte formato local para o mesmo shape
        return loadLBLocal().map(e => ({ name: e.name, word: e.word, attempts: e.att, ts: Math.floor(e.ts / 1000) }));
    }
}

/* ═══════════════════════════════════════════════
   DICTIONARY
═══════════════════════════════════════════════ */
const bar  = document.getElementById('ld-bar');
const ltxt = document.getElementById('ld-text');

async function loadDict() {
    ltxt.textContent = 'CARREGANDO DICIONÁRIO...';
    try {
        const r = await fetch('./dicionario.txt');
        if (!r.ok) throw 0;
        bar.style.width = '55%';
        const txt = await r.text();
        const ws  = txt.split(/\r?\n/)
            .map(w => w.trim().toLowerCase())
            .filter(w => w.length === WL && /^[a-záéíóúâêôãõç]+$/.test(w));
        if (!ws.length) throw 0;
        S.dict = ws;
        bar.style.width = '92%';
        ltxt.textContent = `DICIONÁRIO: ${ws.length} PALAVRAS`;
    } catch {
        ltxt.textContent = 'BANCO LOCAL ATIVADO...';
        bar.style.width = '70%';
        S.dict = FALLBACK;
    }
    bar.style.width = '100%';
}

const valid = w => S.dict.includes(w.toLowerCase());
const pick  = () => S.dict[Math.floor(Math.random() * S.dict.length)].toUpperCase();

/* ═══════════════════════════════════════════════
   GRID
═══════════════════════════════════════════════ */
function buildGrid() {
    const g = document.getElementById('grid');
    g.innerHTML = '';
    for (let r = 0; r < MAX; r++) {
        const row = document.createElement('div');
        row.className = 'row'; row.id = `r${r}`;
        for (let c = 0; c < WL; c++) {
            const t = document.createElement('div');
            t.className = 'tile'; t.id = `t${r}${c}`;
            row.appendChild(t);
        }
        g.appendChild(row);
    }
}

function paintCur() {
    if (!S.word) return; // jogo ainda não iniciado
    for (let c = 0; c < WL; c++) {
        const t = document.getElementById(`t${S.row}${c}`);
        if (!t) return;
        const ch = S.cur[c] || '';
        t.textContent = ch;
        t.className = 'tile' + (ch ? ' has-letter' : '');
    }
}

function revealRow(ri, guess, result) {
    return new Promise(res => {
        for (let c = 0; c < WL; c++) {
            const t = document.getElementById(`t${ri}${c}`);
            const delay = c * 280;
            setTimeout(() => {
                t.classList.add('flip');
                setTimeout(() => {
                    t.classList.remove('has-letter');
                    if      (result[c] === '^') t.classList.add('correct');
                    else if (result[c] === '!') t.classList.add('present');
                    else                         t.classList.add('absent');
                }, 140);
            }, delay);
        }
        setTimeout(res, (WL - 1) * 280 + 500);
    });
}

/* ═══════════════════════════════════════════════
   KEYBOARD
═══════════════════════════════════════════════ */
const ROWS = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L','Ç'],
    ['ENTER','Z','X','C','V','B','N','M','⌫'],
];

function buildKbd() {
    const kbd = document.getElementById('kbd');
    kbd.innerHTML = '';
    ROWS.forEach(row => {
        const el = document.createElement('div');
        el.className = 'krow';
        row.forEach(k => {
            const b = document.createElement('button');
            b.className = 'key' + (['ENTER','⌫'].includes(k) ? ' wide' : '');
            b.textContent = k; b.dataset.k = k; b.id = `k-${k}`;
            b.addEventListener('click', () => press(k));
            el.appendChild(b);
        });
        kbd.appendChild(el);
    });
}

function updateKbd(guess, result) {
    for (let i = 0; i < WL; i++) {
        const ltr = guess[i];
        const cur = S.keyState[ltr];
        const nxt = result[i] === '^' ? 'correct' : result[i] === '!' ? 'present' : 'absent';
        if (cur === 'correct') continue;
        if (cur === 'present' && nxt === 'absent') continue;
        S.keyState[ltr] = nxt;
        const el = document.getElementById(`k-${ltr}`);
        if (el) { el.classList.remove('correct','present','absent'); el.classList.add(nxt); }
    }
}

/* ═══════════════════════════════════════════════
   EVALUATE
═══════════════════════════════════════════════ */
function evaluate(guess, word) {
    const res = Array(WL).fill('x');
    const uw  = Array(WL).fill(false);
    const ug  = Array(WL).fill(false);
    for (let i = 0; i < WL; i++) {
        if (guess[i] === word[i]) { res[i] = '^'; uw[i] = ug[i] = true; }
    }
    for (let i = 0; i < WL; i++) {
        if (ug[i]) continue;
        for (let j = 0; j < WL; j++) {
            if (!uw[j] && guess[i] === word[j]) { res[i] = '!'; uw[j] = true; break; }
        }
    }
    return res.join('');
}

/* ═══════════════════════════════════════════════
   STATUS / RESTART HINT
═══════════════════════════════════════════════ */
let _stTimer;
function status(msg, err = false, dur = 2200) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'show' + (err ? ' err' : '');
    clearTimeout(_stTimer);
    if (dur > 0) _stTimer = setTimeout(() => el.className = '', dur);
}

function showRestartHint(show) {
    const hint = document.getElementById('restart-hint');
    hint.className = show ? 'show' : '';
    document.getElementById('status').className = ''; // limpa status quando game over
}

/* ═══════════════════════════════════════════════
   SCORE POPUP
═══════════════════════════════════════════════ */
function scorePop(pts, ri) {
    const row = document.getElementById(`r${ri}`);
    if (!row) return;
    const rect = row.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'score-pop';
    el.textContent = `+${pts}`;
    el.style.left = (rect.right + 14) + 'px';
    el.style.top  = (rect.top + 10) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1500);
}

/* ═══════════════════════════════════════════════
   GAME LOGIC
═══════════════════════════════════════════════ */
async function press(key) {
    // Bloqueia se: modal aberto, jogo encerrado, animação, jogo não iniciado
    if (_modalOpen || S.over || S.busy || !S.word) return;

    if (key === '⌫' || key === 'BACKSPACE') {
        if (S.cur.length) { S.cur = S.cur.slice(0,-1); paintCur(); }
        return;
    }
    if (key === 'ENTER') { await submit(); return; }

    const ch = key.toUpperCase();
    if (/^[A-ZÁÉÍÓÚÂÊÔÃÕÇ]$/.test(ch) && S.cur.length < WL) {
        S.cur += ch; paintCur();
    }
}

async function submit() {
    if (S.cur.length < WL) {
        document.getElementById(`r${S.row}`).classList.add('shake');
        setTimeout(() => document.getElementById(`r${S.row}`).classList.remove('shake'), 450);
        status('PALAVRA INCOMPLETA', true);
        return;
    }
    if (!valid(S.cur)) {
        document.getElementById(`r${S.row}`).classList.add('shake');
        setTimeout(() => document.getElementById(`r${S.row}`).classList.remove('shake'), 450);
        status('PALAVRA NÃO ENCONTRADA', true);
        return;
    }

    S.busy = true;
    const guess  = S.cur;
    const result = evaluate(guess, S.word);
    S.guesses.push({ guess, result });

    await revealRow(S.row, guess, result);
    updateKbd(guess, result);

    const won = result === '^'.repeat(WL);

    if (won) {
        S.over = S.won = true;
        const attempts   = S.row + 1;
        const prevStreak = S.streak;                              // streak ANTES do incremento
        const mult       = 1 + Math.min(prevStreak * 0.15, 1.5); // multiplica pelo streak ganho
        const pts        = Math.round(BASE[attempts - 1] * mult);

        document.getElementById(`r${S.row}`).classList.add('bounce');
        scorePop(pts, S.row);

        S.score  += pts;
        S.streak += 1; // incrementa DEPOIS de calcular pontos
        S.played += 1;
        S.wins   += 1;
        if (S.score > S.high) S.high = S.score;
        saveStore();
        // Salva em scores.txt via servidor (ou localStorage como fallback)
        saveScoreToFile(S.name, S.word, attempts);
        updateHUD();
        setTimeout(async () => {
            const allScores = await loadScoresFromFile();
            showWin(attempts, pts, prevStreak, allScores);
        }, 900);
    } else {
        S.row += 1;
        S.cur  = '';
        if (S.row >= MAX) {
            S.over = true;
            const oldStreak = S.streak;
            S.streak = 0;
            S.played += 1;
            saveStore(); updateHUD();
            setTimeout(() => showLose(oldStreak), 600);
        }
    }
    S.busy = false;
}

/* ═══════════════════════════════════════════════
   HUD
═══════════════════════════════════════════════ */
function updateHUD() {
    document.getElementById('hud-name-btn').textContent = (S.name || '—').slice(0,8).toUpperCase();
    document.getElementById('hud-score').textContent    = S.score.toLocaleString();
    document.getElementById('hud-streak').textContent   = '×' + S.streak;
    document.getElementById('hud-high').textContent     = S.high.toLocaleString();
    document.getElementById('hud-ratio').textContent    = S.wins + '/' + S.played;
}

/* ═══════════════════════════════════════════════

═══════════════════════════════════════════════ */
function openModal(html) {
    document.getElementById('modal-box').innerHTML = html;
    document.getElementById('overlay').classList.remove('hidden');
    _modalOpen = true;
}
function closeModal() {
    document.getElementById('overlay').classList.add('hidden');
    _modalOpen = false;
    // Se jogo encerrado e modal fechado, mostra hint de reinício
    if (S.over) showRestartHint(true);
}

function showName(afterChange = false) {

        <div class="modal-title info" style="font-size:14px;letter-spacing:3px">

        </div>
        <p style="font-size:10px;color:var(--text-dim);letter-spacing:2px;margin-bottom:16px;text-align:center">
            ${afterChange ? 'ALTERE SEU NOME DE OPERADOR' : 'INSIRA SEU NOME DE OPERADOR'}
        </p>
        <input id="name-inp" class="inp" placeholder="Nome do agente..." maxlength="20"
               value="${afterChange ? S.name : ''}">
        <button class="btn-prim" id="name-ok">
            ${afterChange ? '✓ SALVAR NOME' : '▶ INICIAR SISTEMA'}
        </button>
        ${afterChange ? `<button class="btn-sec" id="name-cancel" style="margin-top:8px">✕ CANCELAR</button>` : ''}
    `);
    setTimeout(() => {
        const inp = document.getElementById('name-inp');
        inp.focus();
        inp.select();
    }, 80);

    const go = () => {
        const v = document.getElementById('name-inp').value.trim();

        S.name = v;

        updateHUD();
        if (!afterChange) startGame();
    };
    document.getElementById('name-ok').onclick = go;
    document.getElementById('name-inp').onkeydown = e => e.key === 'Enter' && go();
    if (afterChange) {
        document.getElementById('name-cancel').onclick = closeModal;
    }
}

function showWin(attempts, pts, prevStreak, allScores = []) {
    const base  = BASE[attempts - 1];
    const bonus = pts - base;
    const multDisplay = (1 + Math.min(prevStreak * 0.15, 1.5)).toFixed(2);

    // Top 5 do placar (ordenados por tentativas, depois mais recente)
    const top5 = allScores.slice(0, 5);
    const lbRows = top5.map((e, i) => {
        const name = (e.name || '?').toUpperCase().slice(0, 10);
        const att  = e.attempts || e.att;
        return `
        <div class="lb-row">
            <span class="lb-n">#${i+1}</span>
            <span class="lb-name">${name}</span>
            <span class="lb-att">${att}/6</span>
            <span class="lb-sc">${e.word || ''}</span>
        </div>`;
    }).join('');

    openModal(`
        <div class="modal-title win">◈ SISTEMA DECIFRADO ◈</div>
        <div class="modal-word">${S.word}</div>
        <div class="breakdown">
            <div class="brow"><span class="lbl">JOGADOR</span><span class="val">${(S.name || '—').toUpperCase()}</span></div>
            <div class="brow"><span class="lbl">TENTATIVAS</span><span class="val">${attempts} / 6</span></div>
            <div class="brow"><span class="lbl">PONTOS BASE</span><span class="val">${base}</span></div>
            <div class="brow"><span class="lbl">MULTIPLICADOR STREAK ×${prevStreak}</span>
                <span class="val" style="color:var(--pink)">× ${multDisplay}</span></div>
            <div class="brow"><span class="lbl">BÔNUS</span>
                <span class="val" style="color:var(--pink)">+${bonus}</span></div>
            <div class="brow total"><span class="lbl">TOTAL</span><span class="val">${pts}</span></div>
        </div>
        ${lbRows ? `<div class="lb"><div class="lb-head">◈ TOP 5 — MENOS TENTATIVAS</div>${lbRows}</div>` : ''}
        <button class="btn-prim" id="w-new">▶ NOVO DESAFIO</button>
        <button class="btn-sec"  id="w-cls">✕ FECHAR</button>
    `);
    document.getElementById('w-new').onclick = () => { closeModal(); startGame(); };
    document.getElementById('w-cls').onclick = closeModal;
}

function showLose(oldStreak) {
    openModal(`
        <div class="modal-title lose">◈ SISTEMA BLOQUEADO ◈</div>
        <p style="font-size:10px;color:var(--text-dim);text-align:center;letter-spacing:2px;margin-bottom:8px">
            PALAVRA CORRETA:
        </p>
        <div class="modal-word lose">${S.word}</div>

            <div class="brow"><span class="lbl">JOGADOR</span><span class="val">${(S.name || '—').toUpperCase()}</span></div>

            <div class="brow"><span class="lbl">SCORE ACUMULADO</span>

        </div>

}

/* ═══════════════════════════════════════════════
   START / INIT
═══════════════════════════════════════════════ */
function startGame() {
    S.word     = pick();
    S.guesses  = [];
    S.cur      = '';
    S.row      = 0;
    S.over     = false;
    S.won      = false;
    S.busy     = false;
    S.keyState = {};
    buildGrid();
    buildKbd();
    document.getElementById('status').className = '';
    showRestartHint(false);
}

// ── Keyboard físico ───────────────────────────
document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    // Não captura quando foco está num input de modal
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    const k = e.key.toUpperCase();
    if (k === 'BACKSPACE') { e.preventDefault(); press('⌫'); }
    else if (k === 'ENTER') { e.preventDefault(); press('ENTER'); }
    else if (/^[A-ZÁÉÍÓÚÂÊÔÃÕÇ]$/.test(k)) press(k);
});

// ── Botões do header ──────────────────────────
document.getElementById('btn-help').addEventListener('click',   showHelp);
document.getElementById('btn-placar').addEventListener('click', showLeaderboard);
document.getElementById('hud-name-btn').addEventListener('click', () => showName(true));
document.getElementById('btn-restart').addEventListener('click', () => {
    showRestartHint(false);
    startGame();
});

// ── Fecha modal ao clicar no overlay ─────────
document.getElementById('overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('overlay')) closeModal();
});

   INIT
═══════════════════════════════════════════════ */
async function init() {
    loadStore(); updateHUD();
    await loadDict();
    setTimeout(() => {
        const ld = document.getElementById('loading');
        ld.classList.add('fade');
        setTimeout(() => ld.style.display = 'none', 520);
        if (!S.name) showName(false);
        else startGame();
    }, 700);
}

init();
